<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Blog</title>
</head>
<body>
    <h1>Create New Blog</h1>

    <form action={{url_for ('create_blog')}} method="post" enctype="multipart/form-data">
     
        <lable for="title">Title:</label>
        <input type="text" name="title" id="title" required><br><br>
        <label for="content">Content:</label><br>   
        <textarea name="content" id="content" rows="5" cols="40" required></textarea><br><br>  
        
        <label for="image_file">Upload File:</label>
        <input type="file" name="image_file" id="image_file">
        <br><br>
        <input type="submit" value="Create Blog">
    </form>
    <br>    

    <a href="{{ url_for('blogs') }}">Back to Blogs</a>
</body>
</html>
