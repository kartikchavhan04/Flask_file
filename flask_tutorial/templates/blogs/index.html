<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1>Blogs</h1>

    <a href="{{ url_for('create_blog') }}">Create New Blog</a>

    <table border="1" cellpadding="10" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Content</th>
                <th>Image</th>
                <th>Date Posted</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            {% for blog in blogs %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ blog.title }}</td>
                <td>{{ blog.content }}</td>
                <td>
                    <img src="{{ url_for('static', filename='uploads/' + blog.file_name) }}" alt="Blog Image" width="70">
                </td>
                <td>{{ blog.date_posted.strftime('%d-%m-%Y %H:%M') }}</td>

                <td>
                    <form action="{{ url_for('delete_blog', id=blog.id) }}" method="POST">
                        <input
                            type="submit"
                            value="Delete"
                            onclick="return confirm('Are you sure you want to delete this blog?');">
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5">No blogs found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
