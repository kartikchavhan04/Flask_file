<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
</head>
<body>

<h1>Student List</h1>

   <a href="{{ url_for('home') }}">Home</a>

|

    <a href="{{ url_for('students') }}">View Students</a>
<br><br>

<table border="1" cellpadding="10">

    <tr>
        <th>ID</th>
        <th>Roll No</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Action</th>
    </tr>

    {% for student in students %}

    <tr>

        <td>{{ student.id }}</td>

        <td>{{ student.roll_no }}</td>

        <td>
            {{ student.first_name }}
            {{ student.last_name }}
        </td>

        <td>{{ student.email }}</td>

        <td>{{ student.phone }}</td>

        <td>
            <a href="{{ url_for('edit_student', id=student.id) }}">
                Edit
            </a>

            <a href="{{ url_for('delete_student', id=student.id) }}"
               onclick="return confirm('Are you sure you want to delete this student?')">
                Delete
            </a>
        </td>

    </tr>

    {% endfor %}

</table>

</body>
</html>
