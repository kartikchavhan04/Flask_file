<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
</head>
<body>

    <h1>Student Login</h1>


     
        <p>
            <a href="{{ url_for('add_student') }}">Register Student First</a>
        </p>

    <form method="POST">

        {{ form.hidden_tag() }}

        <p>
            {{ form.email.label }}<br>
            {{ form.email() }}
        </p>

        <p>
            {{ form.password.label }}<br>
            {{ form.password() }}
        </p>

        <p>
            {{ form.submit() }}
        </p>
       
    </form>

</body>
</html>
