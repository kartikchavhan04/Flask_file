<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>
</head>

<body>

    <h1>Student Management System</h1>

    <!-- ========================= -->
    <!-- ADD STUDENT -->
    <!-- ========================= -->

    <h2>Add Student</h2>

    <form id="studentForm">

        <label>Name:</label>
        <input type="text" id="name" required>

        <br><br>

        <label>Email:</label>
        <input type="email" id="email" required>

        <br><br>

        <label>Marks:</label>
        <input type="number" id="marks" required>

        <br><br>

        <button type="submit">
            Add Student
        </button>

    </form>


    <hr>


    <!-- ========================= -->
    <!-- UPDATE STUDENT -->
    <!-- ========================= -->

    <h2>Update Student</h2>

    <form id="updateForm">

        <label>Student ID:</label>
        <input type="number" id="updateId" required>

        <br><br>

        <label>Name:</label>
        <input type="text" id="updateName">

        <br><br>

        <label>Email:</label>
        <input type="email" id="updateEmail">

        <br><br>

        <label>Marks:</label>
        <input type="number" id="updateMarks">

        <br><br>

        <button type="submit">
            Update Student
        </button>

    </form>


    <hr>


    <!-- ========================= -->
    <!-- GET STUDENTS -->
    <!-- ========================= -->

    <h2>All Students</h2>

    <button onclick="getStudents()">
        Load Students
    </button>

    <br><br>

    <table border="1">

        <thead>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Marks</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody id="studentTable">

        </tbody>

    </table>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
