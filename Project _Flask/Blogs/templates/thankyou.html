{% extends "base.html" %}

{% block title %}Thank You - My Blog{% endblock %}

{% block content %}
<div style="text-align: center; padding: 2rem;">
    <h2>Thank You for Your Feedback!</h2>
    <p style="margin-top: 1rem; font-size: 1.1rem;">
        <strong>Name:</strong> {{ user }}
    </p>
    <p style="margin-top: 1rem; font-size: 1.1rem;">
        <strong>Message:</strong>
    </p>
    <p style="margin-top: 0.5rem; padding: 1rem; background-color: #f9f9f9; border-left: 4px solid #333; text-align: left;">
        {{ message }}
    </p>
    <a href="/" style="margin-top: 2rem; display: inline-block; background-color: #333; color: white; padding: 0.7rem 1.5rem; text-decoration: none; border-radius: 3px;">
        Back to Home
    </a>
</div>
{% endblock %}
