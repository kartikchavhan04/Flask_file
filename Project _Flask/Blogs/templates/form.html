{% extends "base.html" %}

{% block title %}Feedback - My Blog{% endblock %}

{% block content %}
<h2>Send Us Your Feedback</h2>
<form method="POST" action="/">
    <div style="margin-bottom: 1rem;">
        <label for="username" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Your Name:</label>
        <input 
            type="text" 
            id="username" 
            name="username" 
            required 
            style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 3px;"
        >
    </div>
    
    <div style="margin-bottom: 1rem;">
        <label for="message" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Your Message:</label>
        <textarea 
            id="message" 
            name="message" 
            rows="6" 
            required 
            style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 3px; font-family: Arial, sans-serif;"
        ></textarea>
    </div>
    
    <button 
        type="submit" 
        style="background-color: #333; color: white; padding: 0.7rem 1.5rem; border: none; border-radius: 3px; cursor: pointer; font-size: 1rem;"
    >
        Submit Feedback
    </button>
</form>
{% endblock %}
